name: 每日更新密码

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 计算今日密码
        env:
          GFX_SECRET: ${{ secrets.GFX_SECRET }}
        run: python3 scripts/daily.py
      - name: 提交
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add password.md
          git commit -m "daily password $(date -u +%Y-%m-%d)" || echo "no change"
          git push
